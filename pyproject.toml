[project]
name = "vps-docker-mcp"
version = "0.2.0"
description = "Secure MCP server for VPS diagnostics and Docker operations over SSH"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.20.0,<3",
    "mcp>=1.20.0,<2",
    "python-dotenv>=1.1.0,<2",
]

[project.scripts]
vps-docker-mcp = "vps_docker_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vps_docker_mcp"]
