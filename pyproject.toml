[project]
name = "vps-docker-mcp"
version = "0.2.0"
description = "Secure MCP server for VPS diagnostics and Docker operations over SSH"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.20.0,<3",
    "mcp>=1.20.0,<2",
    "python-dotenv>=1.1.0,<2",
]

[project.scripts]
vps-docker-mcp = "vps_docker_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vps_docker_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
